[workspace]
name = "figure-data-unwrapper"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.13.*"
numpy = ">=2,<3"
matplotlib-base = ">=3.9,<4"

[pypi-dependencies]
figure-data-unwrapper = { path = ".", editable = true }

[tasks]
generate-example = "python examples/parabola/parabola.py"
example = { cmd = "python examples/parabola/parabola_check.py", depends-on = ["generate-example"] }
detect-frame = { cmd = "python examples/detect_frame.py", depends-on = ["generate-example"] }
test = "python -m unittest discover -s tests -v"
test-frame-variants = "python tests/run_frame_variants.py"
binarization-trial = "python examples/binarization_trial.py"
detect-ticks = { cmd = "python examples/detect_ticks.py", depends-on = ["generate-example"] }
rank-colors = { cmd = "python examples/rank_colors.py", depends-on = ["generate-example"] }
check-parabola = { depends-on = ["example"] }
extract-parabola-markers = "python examples/parabola/parabola_markers.py"
check-real-example1 = "python examples/real_example_1/real_example1_check.py"
check-real-example2 = "python examples/real_example_2/real_example2_check.py"
remove-real-example2-colors = "python examples/real_example_2/real_example2_remove_colors.py"
extract-real-example2-black = "python examples/real_example_2/real_example2_black_curves.py"
extract-real-example1-red = "python examples/real_example_1/real_example1_red.py"
extract-real-example1-markers = "python examples/real_example_1/real_example1_markers.py"
