[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figure-data-unwrapper"
version = "0.1.0"
description = "Reconstruct data from scientific figures."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/figure_data_unwrapper"]
